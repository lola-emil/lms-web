<!-- left drawer -->
<div class="drawer lg:drawer-open">
  <input id="left-drawer" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content">
    <!-- right drawer -->
    <div class="drawer drawer-end">
      <input id="right-drawer" type="checkbox" class="drawer-toggle" />
      <div class="drawer-content h-screen overflow-y-scroll">

        <ng-content />

      </div>
    </div>
    <!-- /right drawer -->
  </div>
  <div class="drawer-side">
    <label for="left-drawer" class="drawer-overlay"></label>
    <div class="min-h-full flex flex-col w-72 bg-base-100 lg:bg-secondary/5 p-4 text-base-content border-r-[1px]">
      <!-- Sidebar content here -->
      <div class="h-56 gap-5 flex flex-col items-center">
        <img src="/sclc-logo-removebg-preview.png" class="w-32" alt="">
        <h3 class="font-semibold text-md">Sta. Cruz Learning Center</h3>
      </div>
