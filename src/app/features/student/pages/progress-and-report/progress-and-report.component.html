<app-drawer>
  <app-topbar title="Gradebook"></app-topbar>
  <br>
  <div class="container mx-auto px-5">
    <div class="flex justify-between items-center">
      <select name="" id="" class="select select-bordered">
        <option value="">Filter by subject</option>
        <option value="">Filter by total grade</option>
      </select>

      <a href="" class="btn btn-sm btn-primary">Download CSV <span>
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M18.25 20.5a.75.75 0 1 1 0 1.5l-13 .004a.75.75 0 1 1 0-1.5l13-.004ZM11.648 2.012l.102-.007a.75.75 0 0 1 .743.648l.007.102-.001 13.685 3.722-3.72a.75.75 0 0 1 .976-.073l.085.073a.75.75 0 0 1 .072.976l-.073.084-4.997 4.997a.75.75 0 0 1-.976.073l-.085-.073-5.003-4.996a.75.75 0 0 1 .976-1.134l.084.072 3.719 3.714L11 2.755a.75.75 0 0 1 .648-.743l.102-.007-.102.007Z"
              class="fill-primary-content" />
          </svg>
        </span></a>
    </div>
    <table class="table table-zebra">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Quiz 1 (12.5%)</th>
          <th>Quiz 2 (12.5%)</th>
          <th>Quiz 3 (12.5%)</th>
          <th>Quiz 4 (12.5%)</th>
          <th>Exam (50%)</th>
          <th>TOTAL</th>
        </tr>
      </thead>
      <tbody>
        @for (item of grades; track $index) {
        <tr>
          <td>{{ item.subject }}</td>
          @for (grade of item.grades; track $index) {
          <td align="center">{{ grade.score }}</td>
          }
          <td class="font-bold">{{ item.total | number:'1.2-2' }}</td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</app-drawer>
