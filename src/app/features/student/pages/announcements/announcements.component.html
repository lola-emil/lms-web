<app-drawer>
  <app-topbar title="Announcements"></app-topbar>

  <div class="w-full flex justify-between">
    <div></div>
    <div></div>
  </div>
  <div class="container mx-auto px-5 gap-5 mt-3 flex">
    <button class="btn btn-primary btn-sm rounded-full px-5">All</button>
    <button class="btn btn-sm rounded-full px-5">Teachers</button>
    <button class="btn btn-sm rounded-full px-5">Admins</button>
  </div>
  <div class="container mx-auto px-5 gap-5 mt-3 flex">
    <div class="flex-1 flex-col flex gap-5">

      @for (item of announcements; track $index) {
      <div class="rounded-xl bg-slate-50">

        <!-- CONTENT -->
        <div class="p-5">
          <div class="flex justify-between items-center">
            <div>
              <p class="text-sm font-semibold">{{ item.name }}</p>
              <p class="text-xs">{{ item.date | date}} </p>
            </div>
            <button class="btn btn-sm btn-ghost btn-circle">
              <svg width="24" height="24" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M7.75 12a1.75 1.75 0 1 1-3.5 0 1.75 1.75 0 0 1 3.5 0ZM13.75 12a1.75 1.75 0 1 1-3.5 0 1.75 1.75 0 0 1 3.5 0ZM18 13.75a1.75 1.75 0 1 0 0-3.5 1.75 1.75 0 0 0 0 3.5Z"
                  class="fill-base-content" />
              </svg>
            </button>
          </div>
          <div class="">
            <h3 class="text-lg my-3">{{ item.title }}</h3>
            <p class="text-sm">{{ item.body }}</p>
          </div>
          <br>
          <div class="flex justify-end">
            <div class="flex gap-3">
              <button>
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="m12.82 5.58-.82.822-.824-.824a5.375 5.375 0 1 0-7.601 7.602l7.895 7.895a.75.75 0 0 0 1.06 0l7.902-7.897a5.376 5.376 0 0 0-.001-7.599 5.38 5.38 0 0 0-7.611 0Zm6.548 6.54L12 19.485 4.635 12.12a3.875 3.875 0 1 1 5.48-5.48l1.358 1.357a.75.75 0 0 0 1.073-.012L13.88 6.64a3.88 3.88 0 0 1 5.487 5.48Z"
                    class="fill-base-content" />
                </svg>
              </button>

              <button>
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M6.747 4h3.464a.75.75 0 0 1 .102 1.493l-.102.007H6.747a2.25 2.25 0 0 0-2.245 2.096l-.005.154v9.5a2.25 2.25 0 0 0 2.096 2.245l.154.005h9.5a2.25 2.25 0 0 0 2.245-2.096l.005-.154v-.498a.75.75 0 0 1 1.494-.101l.006.101v.498a3.75 3.75 0 0 1-3.55 3.745l-.2.005h-9.5a3.75 3.75 0 0 1-3.745-3.55l-.005-.2v-9.5a3.75 3.75 0 0 1 3.55-3.745l.2-.005h3.464-3.464ZM14.5 6.52V3.75a.75.75 0 0 1 1.187-.61l.082.069 5.994 5.75c.28.268.306.7.077.997l-.077.085-5.994 5.752a.75.75 0 0 1-1.262-.434l-.007-.107v-2.725l-.344.03c-2.4.25-4.7 1.33-6.914 3.26-.52.453-1.323.025-1.237-.658.664-5.32 3.446-8.252 8.195-8.62l.3-.02V3.75v2.77ZM16 5.509V7.25a.75.75 0 0 1-.75.75c-3.874 0-6.274 1.676-7.312 5.157l-.079.279.352-.237C10.45 11.737 12.798 11 15.251 11a.75.75 0 0 1 .743.648l.007.102v1.743L20.16 9.5l-4.16-3.991Z"
                    class="fill-base-content" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      }

    </div>
    <div class="card w-96 hidden sticky top-0 max-h-screen lg:flex">
      <div class="card-body"></div>
    </div>
  </div>

  <br>
  <br>
  <br>
</app-drawer>
