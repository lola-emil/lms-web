<div class="container mx-auto lg:p-6">
  <h1 class="text-2xl font-bold lg:text-center">📊 Score History</h1>

  <div *ngIf="scoreHistory.length === 0" class="text-gray-500 text-center mt-4">
    No scores available.
  </div>

  <div *ngFor="let history of scoreHistory" class="card bg-base-100 shadow-md mt-4 border-l-4"
       [ngClass]="{
         'border-green-500': history.type === 'Quiz',
         'border-red-500': history.type === 'Exam',
         'border-blue-500': history.type === 'Assignment',
         'border-purple-500': history.type === 'Project'
       }">
    <div class="card-body">
      <h3 class="font-bold text-lg">{{ history.title }}</h3>
      <p class="text-md text-gray-600">📆 {{ history.date }} | 🎯 {{ history.type }}</p>
      <p class="text-md text-gray-700">🏆 Score: <strong>{{ history.score }} / {{ history.total }}</strong></p>

      <!-- Review Answers Button -->
      <button (click)="reviewAnswers(history.id)" class="btn btn-info w-full mt-2">🔍 Review Answers</button>
    </div>
  </div>
</div>
