<div class="flex flex-col">
  <br>
  @if(naayKlase) {
    <div class="card">
      <div class="card-body items-center">
        <h3 class="text-xl font-semibold">Ongoing Session</h3>
        <div class="indicator">
          <a class="btn btn-sm btn-primary ">
            Join Class
          </a>
          <span class="badge badge-xs bg-green-500 indicator-item">
          </span>
      </div>
      </div>
    </div>
  }
  @else {
    <div class="card ">
      <div class="card-body items-center">
        <h3 class="text-xl font-semibold text-center">
          No live session for today.
        </h3>
        <p class="text-center">
          Next scheduled session will be on {{ schedule | date}}
        </p>
      </div>
    </div>
    <br>
  }
</div>
