<app-drawer>
  <app-topbar title="Courses"></app-topbar>

  <!-- <br> -->

  <div class="container mx-auto px-5">
    <div class="flex gap-5 w-full max-w-screen-md">
      <div class=" flex-1">
        <div class="">
          <h3 class="text-2xl font-semibold">Statistics and Probability</h3>
          <p>Dr. Alice Johnson</p>
          <br>
          <img src="https://loremflickr.com/500/200?random=3" class="max-h-96 w-full rounded-md" alt="">
          <br>
          <div class="container mx-auto gap-5 my-3 flex">
            <button class="btn btn-primary btn-sm rounded-full px-5">Lectures</button>
            <button class="btn btn-sm rounded-full px-5">Activities</button>
            <button class="btn btn-sm rounded-full px-5">Forum</button>
          </div>

          <!-- <br> -->
            <div class="flex flex-col gap-2">
              @for (item of lessons; track $index) {
                <div class="p-5 flex items-center gap-2  rounded-lg"
                class="p-5 flex items-center gap-2 rounded-lg bg-slate-50">

                  @if(item.type == "video") {
                  <svg width="24" height="24" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M7.608 4.615a.75.75 0 0 0-1.108.659v13.452a.75.75 0 0 0 1.108.659l12.362-6.726a.75.75 0 0 0 0-1.318L7.608 4.615ZM5 5.274c0-1.707 1.826-2.792 3.325-1.977l12.362 6.726c1.566.853 1.566 3.101 0 3.953L8.325 20.702C6.826 21.518 5 20.432 5 18.726V5.274Z"
                      class="fill-base-content" />
                  </svg>
                  }

                  @else {
                  <svg width="24" height="24" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M5.754 22.005a2.25 2.25 0 0 1-2.25-2.25L3.502 5.75a2.25 2.25 0 0 1 2.25-2.25l.747-.001.001-.749a.75.75 0 0 1 .648-.743L7.25 2a.75.75 0 0 1 .743.648L8 2.75v.749H11V2.75a.75.75 0 0 1 .65-.743l.1-.007a.75.75 0 0 1 .744.648l.007.102v.749h2.997l.001-.749a.75.75 0 0 1 .648-.743L16.25 2a.75.75 0 0 1 .743.648L17 2.75v.749h.749a2.25 2.25 0 0 1 2.25 2.25l.001 11c0 .06-.007.12-.02.176l-.03.094-.045.096-.02.032a.685.685 0 0 1-.105.133l-4.504 4.505a.74.74 0 0 1-.085.073l.085-.073a.744.744 0 0 1-.105.087l-.088.052-.116.047-.114.026-.053.006-.055.002H5.754ZM17.748 5H5.742a.75.75 0 0 0-.74.75l.002 14.004c0 .415.336.75.75.75h8.24l.001-2.254a2.25 2.25 0 0 1 2.096-2.245l.154-.005H18.5V5.75a.75.75 0 0 0-.75-.75Zm-.31 12.5h-1.193a.75.75 0 0 0-.743.648l-.007.102v1.194l1.943-1.944ZM7.25 16h3.998a.75.75 0 0 1 .102 1.493l-.102.007H7.25a.75.75 0 0 1-.102-1.493L7.25 16h3.998H7.25Zm0-4h8.998a.75.75 0 0 1 .102 1.493l-.102.007H7.25a.75.75 0 0 1-.102-1.493L7.25 12h8.998H7.25Zm0-4h8.998a.75.75 0 0 1 .102 1.493l-.102.007H7.25a.75.75 0 0 1-.102-1.493L7.25 8h8.998H7.25Z"
                      class="fill-base-content" />
                  </svg>
                  }

                  <div>
                    <p class="font-semibold">{{ item.title }}</p>
                    <p class="text-sm">{{ item.duration }}</p>
                  </div>
                </div>
                }
            </div>
        </div>
      </div>

    </div>
  </div>

  <br>
  <br>
  <br>
</app-drawer>
