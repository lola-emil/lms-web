<app-drawer>
  <app-topbar></app-topbar>

  <div class="container mx-auto px-5">
    <div class="flex items-center lg:justify-between gap-3">
      <div class="flex items-center gap-5">
        <input type="text" placeholder="Search Course" (input)="searchSubject($event)"
          class="input w-full lg:w-96 lg:input-sm input-bordered">
        <button class="btn btn-sm btn-primary" (click)="openModal()">Add subject</button>

        <select class="select select-bordered select-sm" (change)="filter($event)">
          <option value="" selected>All</option>

          @for (item of levels; track $index) {
          <option [value]="item.id">Grade {{ item.level }}</option>
          }
        </select>
      </div>


    </div>

    <br>

    <div class="grid gap-5 grid-cols-1 md:grid-cols-2 xl:grid-cols-3">
      @for (item of (!!searchQuery ? filterSubject() : mgaSubjects); track $index) {

      <a [routerLink]="item.id + ''" class="rounded-lg border-[1px] shadow">
        <div>
          @if (item.coverImgUrl) {
          <img [src]="'http://' + item.coverImgUrl" class="w-full max-h-48 object-cover rounded-tl rounded-tr" alt=""
            crossOrigin="anonymous">
          }
          @else {
          <img [src]="imgPlaceholder(item.title + item.gradeLevel.level)"
            class="w-full max-h-48 object-cover rounded-tl rounded-tr" alt="" crossOrigin="anonymous">
          }
          <!-- <img {[]}="https://loremflickr.com/100/100?random=3" alt=""> -->
        </div>
        <div class="p-5">
          <p class="font-semibold">{{item.title }}</p>
          <div class="flex flex-col">
            <p>Grade {{ item.gradeLevel.level }}</p>
          </div>
          <div class="flex mt-3 justify-between">
            <div class="text-sm flex items-center gap-1" title="12 Participants/Students">
              <!-- <span>{{ item.subjectMaterials.length }}</span> -->
              <!-- <span>Module(s)</span> -->
            </div>
          </div>
        </div>
      </a>

      }
    </div>

  </div>

  <!-- Open the modal using ID.showModal() method -->
  <dialog #subjectModal class="modal" (close)="resetForm()">
    <div class="modal-box">
      <h3 class="text-lg font-bold">Add New Subject</h3>
      <br>
      <label class="form-control w-full">
        <div class="label">
        </div>
        <input type="text" [formControl]="title" placeholder="Type here" class="input input-bordered w-full" />
        <div class="label">
          <span class="label-text-alt text-error">{{subjectErrors.title ?? ""}}</span>
        </div>
      </label>
      <br>
      <br>
      <select [formControl]="selectedGradeLevel" class="select select-bordered w-full">
        <option value="null" selected disabled>-- Select Grade Level</option>

        @for (item of levels; track $index) {
        <option [value]="item.id">{{ item.level }}</option>
        }

      </select>

      <br>
      <br>

      <label class="form-control w-full">
        <div class="label">
          <span class="label-text">Cover Image (optional)</span>
        </div>
        <input type="file" (input)="chooseCoverImage($event)" placeholder="Type here"
          class="file-input file-input-bordered w-full" accept="image/*" />
        <div class="label">
        </div>
      </label>
      <div class="modal-action">
        <button class="btn btn-primary" (click)="addSubject()" [disabled]="addSubjectInProgress">
          @if (addSubjectInProgress) {
            <span class="loading loading-dots"></span>
          }
          @else {
            <span>Submit</span>
          }
        </button>
        <form method="dialog">
          <!-- if there is a button in form, it will close the modal -->
          <button class="btn">Close</button>
        </form>
      </div>
    </div>
  </dialog>
</app-drawer>



<div class="toast toast-top toast-center">
  @for (item of toastMessages; track $index) {
  <div class="alert alert-success">
    <span>{{item.message}}</span>
  </div>
  }
</div>
