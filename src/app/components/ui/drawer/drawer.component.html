<div class="drawer drawer-end">
  <input #drawerCheckbox id="my-drawer-4" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content">
    <ng-content></ng-content>
  </div>
  <div class="drawer-side">
    <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
    <ul class="menu border-l bg-neutral-900  border-neutral-700 text-base-content min-h-full w-1/2 p-4">
      <div class="w-full flex items-center">

        <div class="tooltip tooltip-bottom [--tooltip-color:#404040]" data-tip="Close panel">
          <button class="btn btn-xs btn-ghost" (click)="drawerService.closeDrawer()">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M9.193 9.248a.75.75 0 0 1 1.059-.055l2.5 2.25a.75.75 0 0 1 0 1.114l-2.5 2.25a.75.75 0 1 1-1.004-1.114l1.048-.943H6.75a.75.75 0 0 1 0-1.5h3.546l-1.048-.943a.75.75 0 0 1-.055-1.059ZM22 17.25A2.75 2.75 0 0 1 19.25 20H4.75A2.75 2.75 0 0 1 2 17.25V6.75A2.75 2.75 0 0 1 4.75 4h14.5A2.75 2.75 0 0 1 22 6.75v10.5Zm-6.998 1.25v-13H4.75c-.69 0-1.25.56-1.25 1.25v10.5c0 .69.56 1.25 1.25 1.25h10.252Z"
                class="fill-neutral-400" />
            </svg>
          </button>
        </div>

        <div class="tooltip tooltip-bottom [--tooltip-color:#404040] tooltip-primary" data-tip="Open in full page">
          <button class="btn btn-xs btn-ghost">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12.748 3.001h7.554l.1.014.099.028.061.026a.72.72 0 0 1 .218.15l.04.044.061.082.037.065.039.09.02.064.013.064.009.093v7.534a.75.75 0 0 1-1.493.102l-.006-.102-.001-5.696-13.94 13.945h5.69a.75.75 0 0 1 .744.65l.007.1a.75.75 0 0 1-.649.744l-.101.007H3.714L3.684 21a.705.705 0 0 1-.187-.04l-.09-.038-.018-.01a.746.746 0 0 1-.384-.553l-.007-.105V12.75a.75.75 0 0 1 1.493-.102l.007.102v5.692L18.438 4.5l-5.69.001a.75.75 0 0 1-.743-.648l-.007-.102a.75.75 0 0 1 .648-.743L12.748 3Z"
                class="fill-neutral-400" />
            </svg>
          </button>

        </div>
      </div>
      <div #drawerContainer></div>
    </ul>
  </div>
</div>
