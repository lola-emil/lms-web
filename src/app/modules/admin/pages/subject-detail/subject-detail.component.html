<nav class="navbar bg-base-100 border-b border-base-content/5">
  <div class="navbar-start">
    <a routerLink="/admin/subjects-and-curriculum" class="btn btn-sm">Go Back</a>
  </div>
  <div class="navbar-end"></div>
</nav>

<div class="breadcrumbs text-sm">
  <ul class="ml-5">
    <li class="font-semibold">Academic Management</li>
    <li class="font-semibold">Subjects & Curriculum</li>
  </ul>
</div>



<br>


<div class="container mx-auto">
  <input type="text" class="font-semibold border border-transparent hover:bg-base-300 rounded-md text-4xl"
    [formControl]="subjectName">
  <br>
  <br>

  <table>
    <tr>
      <td class="py-2 pr-5 text-md flex items-center gap-3">
        <span>
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 2v6a2 2 0 0 0 2 2h6v10a2 2 0 0 1-2 2h-6.81A6.5 6.5 0 0 0 4 11.498V4a2 2 0 0 1 2-2h6Zm1.5.5V8a.5.5 0 0 0 .5.5h5.5l-6-6Zm-1.5 15a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0Zm-2.146-2.354a.5.5 0 0 0-.708 0L5.5 18.793l-1.646-1.647a.5.5 0 0 0-.708.708l2 2a.5.5 0 0 0 .708 0l4-4a.5.5 0 0 0 0-.708Z"
              class="fill-base-content" />
          </svg>
        </span>
        Grade Level
      </td>
      <td class="text-md">
        <select class="select select-sm" [formControl]="gradeLevel">
          <option value="" disabled selected>-- Select Grade Level</option>
          @for (item of gradeLevels; track $index) {
            <option [value]="item.id" class="text-center">{{ item.level }}</option>
          }
        </select>
      </td>
    </tr>

    <tr>
      <td class="py-1 pr-5 text-md flex items-center gap-3">
        <span>
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M21 8.5v9.25A3.25 3.25 0 0 1 17.75 21H6.25A3.25 3.25 0 0 1 3 17.75V8.5h18ZM7.25 15a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5ZM12 15a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm-4.75-4.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm4.75 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm4.75 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm1-7.5A3.25 3.25 0 0 1 21 6.25V7H3v-.75A3.25 3.25 0 0 1 6.25 3h11.5Z"
              class="fill-base-content" />
          </svg>
        </span>
        School Year
      </td>
      <td class="text-md">
        <select name="" id="" class="select select-sm">
          <option value="">2025-2026</option>
        </select>
      </td>
    </tr>
    <tr>
      <td class="py-1 pr-12 text-md flex items-center gap-3">
        <span>
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M14.754 10c.966 0 1.75.784 1.75 1.75v4.749a4.501 4.501 0 0 1-9.002 0V11.75c0-.966.783-1.75 1.75-1.75h5.502Zm-7.623 0c-.35.422-.575.95-.62 1.53l-.01.22v4.749c0 .847.192 1.649.534 2.365A4.001 4.001 0 0 1 2 14.999V11.75a1.75 1.75 0 0 1 1.606-1.744L3.75 10h3.381Zm9.744 0h3.375c.966 0 1.75.784 1.75 1.75V15a4 4 0 0 1-5.03 3.866c.3-.628.484-1.32.525-2.052l.009-.315V11.75c0-.665-.236-1.275-.63-1.75ZM12 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm6.5 1a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm-13 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"
              class="fill-base-content" />
          </svg>
        </span>
        Enrolled Teachers
      </td>
      <td class="text-md" align="center">5</td>
    </tr>
  </table>

  <br>
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-5">
      <p class="text-lg font-semibold">Enrolled Teachers</p>
      <button class="btn btn-sm btn-outline">Add new teacher</button>
    </div>
    <div>
      <div class="dropdown">
        <div tabindex="0" role="button" class="btn btn-sm btn-outline btn-ghost border m-1">Table View</div>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
          <li><a>Card</a></li>
          <li><a>Item 2</a></li>
        </ul>
      </div>

      <div class="dropdown">
        <div tabindex="0" role="button" class="btn btn-sm btn-outline btn-ghost border m-1">Filter</div>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
          <li><a>Card</a></li>
          <li><a>Item 2</a></li>
        </ul>
      </div>

      <div class="dropdown">
        <div tabindex="0" role="button" class="btn btn-sm btn-outline btn-ghost border m-1">Sort</div>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
          <li><a>Card</a></li>
          <li><a>Item 2</a></li>
        </ul>
      </div>
      <div class="join">
        <button class="join-item btn btn-sm btn-outline">«</button>
        <button class="join-item btn btn-sm btn-outline">Page 1</button>
        <button class="join-item btn btn-sm btn-outline">»</button>
      </div>
    </div>


  </div>

  <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Section</th>
          <!-- Date kung kanus a gi add -->
          <th>Added at</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
