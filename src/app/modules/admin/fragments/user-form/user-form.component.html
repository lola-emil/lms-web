<form [formGroup]="userFormGroup" (submit)="onSubmit()">
  <div class="grid grid-cols-3 gap-5">
    <label class="form-control w-full ">
      <div class="label">
        <span class="label-text">First Name <span class="text-red-500">*</span></span>
      </div>
      <input type="text" formControlName="firstname" class="input input-bordered w-full " />
      <div class="label">
        <span class="label-text-alt"></span>
      </div>
    </label>

    <label class="form-control w-full ">
      <div class="label">
        <span class="label-text">Middle Name</span>
      </div>
      <input type="text" formControlName="middlename" class="input input-bordered w-full " />
      <div class="label">
        <span class="label-text-alt"></span>
      </div>
    </label>

    <label class="form-control w-full ">
      <div class="label">
        <span class="label-text">Last Name <span class="text-red-500">*</span></span>
      </div>
      <input type="text" formControlName="lastname" class="input input-bordered w-full " />
      <div class="label">
        <span class="label-text-alt"></span>
      </div>
    </label>
  </div>


  <label class="form-control w-full ">
    <div class="label">
      <span class="label-text">Address</span>
    </div>
    <textarea formControlName="address" class="textarea textarea-bordered"></textarea>
    <div class="label">
      <span class="label-text-alt"></span>
    </div>
  </label>



  <label class="form-control w-full ">
    <div class="label">
      <span class="label-text">Email <span class="text-red-500">*</span></span>
    </div>
    <input type="text" formControlName="email" class="input input-bordered w-full " />
    <div class="label">
      <span class="label-text-alt"></span>
    </div>
  </label>


  <label class="form-control w-full ">
    <div class="label">
      <span class="label-text">Password <span class="text-red-500">*</span></span>
    </div>
    <input type="password" formControlName="password" class="input input-bordered w-full " />
    <div class="label">
      <span class="label-text-alt"></span>
    </div>
  </label>

  <label class="form-control w-full max-w-sm">
    <div class="label">
      <span class="label-text">User Role <span class="text-red-500">*</span></span>
    </div>
    <select name="" formControlName="role" class="select select-bordered" (change)="updateRoleInfoSection($event)">
      <option value="">-- Select user role</option>
      <option value="teacher">Teacher</option>
      <option value="student">Student</option>
      <option value="admin">Admin</option>
    </select>
    <div class="label">
      <span class="label-text-alt"></span>
    </div>
  </label>


  @if(selectedRole == "student") {
  <br>
  <h3 class="">Student's Details</h3>
  <div formGroupName="student_info">
    <label class="form-control w-full ">
      <div class="label">
        <span class="label-text">Student No. </span>
      </div>
      <input type="text" formControlName="student_no" class="input input-bordered w-full " />
      <div class="label">
        <span class="label-text-alt"></span>
      </div>
    </label>

    <div class="grid grid-cols-2 gap-5">
      <label class="form-control w-full ">
        <div class="label">
          <span class="label-text">Grade Level <span class="text-red-500">*</span></span>
        </div>
        <select formControlName="grade_level_id" class="select select-bordered" (change)="updateSection($event)">
          <option value="">-- Select grade level</option>

          @for (item of gradeLevels; track $index) {
          <option [value]="item.id">{{ item.grade_level }}</option>
          }
        </select>
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>

      <label class="form-control w-full ">
        <div class="label">
          <span class="label-text">Section <span class="text-red-500">*</span></span>
        </div>
        <select name="" formControlName="grade_section_id" class="select select-bordered">
          <option value="">-- Select grade level section</option>

          @for (item of gradeSections; track $index) {
            <option [value]="item.id">{{ item.section_name }}</option>
          }
        </select>
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>
    </div>
  </div>

  }
  @if (selectedRole== "teacher") {
  <!-- <h1>Dapat diri ibutang kung unsa nga subject and section ang i handle sa teacher</h1> -->
  <br>
  <h3 class="">Enrolled Subjects</h3>

  <div class="flex flex-col">
    @for (item of enrolledSubjects.controls; track $index) {
    <div class="flex items-center gap-5">
      <label class="form-control w-full ">
        <div class="label">
        </div>
        <select name="" class="select select-bordered">
          <option value="">-- Select subject</option>
        </select>
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>

      <label class="form-control w-full ">
        <div class="label">
        </div>
        <select name="" class="select select-bordered">
          <option value="">-- Select grade level</option>
        </select>
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>

      <label class="form-control w-full ">
        <div class="label">
        </div>
        <select name="" class="select select-bordered">
          <option value="">-- Select grade level section</option>
        </select>
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>


      <button type="button" class="btn border-none bg-red-500" (click)="removeTeahcerSubject($index)">
        <span>
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 1.75a3.25 3.25 0 0 1 3.245 3.066L15.25 5h5.25a.75.75 0 0 1 .102 1.493L20.5 6.5h-.796l-1.28 13.02a2.75 2.75 0 0 1-2.561 2.474l-.176.006H8.313a2.75 2.75 0 0 1-2.714-2.307l-.023-.174L4.295 6.5H3.5a.75.75 0 0 1-.743-.648L2.75 5.75a.75.75 0 0 1 .648-.743L3.5 5h5.25A3.25 3.25 0 0 1 12 1.75Zm6.197 4.75H5.802l1.267 12.872a1.25 1.25 0 0 0 1.117 1.122l.127.006h7.374c.6 0 1.109-.425 1.225-1.002l.02-.126L18.196 6.5ZM13.75 9.25a.75.75 0 0 1 .743.648L14.5 10v7a.75.75 0 0 1-1.493.102L13 17v-7a.75.75 0 0 1 .75-.75Zm-3.5 0a.75.75 0 0 1 .743.648L11 10v7a.75.75 0 0 1-1.493.102L9.5 17v-7a.75.75 0 0 1 .75-.75Zm1.75-6a1.75 1.75 0 0 0-1.744 1.606L10.25 5h3.5A1.75 1.75 0 0 0 12 3.25Z"
              class="fill-neutral-300" />
          </svg>
        </span>
      </button>

    </div>
    }
  </div>

  <div (click)="addTeacherEnrolledSubject()" class="btn w-full border-dashed border-neutral-600">Add new subject</div>
  }

  <br>
  <br>
  <br>
  <button class="btn btn-primary w-full">Submit</button>
</form>
