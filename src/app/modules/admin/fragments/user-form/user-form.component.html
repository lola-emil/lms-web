<form class="container mx-auto">
  <section class="grid grid-cols-12">
    <div class="col-span-2">
      <p class="font-semibold text-lg">Profile</p>
      <!-- <span class="text-sm">Manage your exsisting team</span> -->
    </div>

    <div class="col-span-10">
      <div class="grid grid-cols-3 gap-5">
        <label class="form-control w-full ">
          <div class="label">
            <span class="label-text">Firstname</span>
          </div>
          <input type="text" formControlName="fname" class="input input-bordered w-full " />
          <div class="label">
            <span class="label-text-alt"></span>
          </div>
        </label>

        <label class="form-control w-full ">
          <div class="label">
            <span class="label-text">Middlename</span>
          </div>
          <input type="text" formControlName="fname" class="input input-bordered w-full " />
          <div class="label">
            <span class="label-text-alt"></span>
          </div>
        </label>

        <label class="form-control w-full ">
          <div class="label">
            <span class="label-text">Lastname</span>
          </div>
          <input type="text" formControlName="fname" class="input input-bordered w-full " />
          <div class="label">
            <span class="label-text-alt"></span>
          </div>
        </label>
      </div>

      <label class="form-control w-full ">
        <div class="label">
          <span class="label-text">Contact No.</span>
        </div>
        <input type="text" formControlName="fname" class="input input-bordered w-full " />
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>

      <label class="form-control w-full ">
        <div class="label">
          <span class="label-text">Address</span>
        </div>
        <textarea class="textarea textarea-bordered" placeholder="Full address"></textarea>
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>
    </div>
  </section>

  <br>
  <section class="grid grid-cols-12">
    <div class="col-span-2">
      <p class="font-semibold text-lg">Credential</p>
      <!-- <span class="text-sm">Manage your exsisting team</span> -->
    </div>

    <div class="col-span-10">
      <label class="form-control w-full ">
        <div class="label">
          <span class="label-text">Email</span>
        </div>
        <input type="text" formControlName="fname" class="input input-bordered w-full " />
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>

      <label class="form-control w-full ">
        <div class="label">
          <span class="label-text">Password</span>
        </div>
        <input type="text" formControlName="fname" class="input input-bordered w-full " />
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>

      <label class="form-control max-w-xs">
        <div class="label">
          <span class="label-text">Role</span>
        </div>
        <select class="select select-bordered">
          <option value="" disabled selected >-- Select role</option>
          @for (item of userRoles; track $index) {
            <option [value]="item.id">{{ item.role_name }}</option>
          }
        </select>
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>



    </div>
  </section>
</form>
