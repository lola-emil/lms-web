<form class="container mx-auto">
  <section class="grid grid-cols-12">
    <div class="col-span-2">
      <!-- <div class="font-semibold text-lg">Subject</div> -->
    </div>

    <div class="col-span-10">
      <label for="" class="form-control w-full">
        <div class="label">
          <div class="label-text">Title</div>
        </div>
        <input type="text" class="input input-bordered w-full">
        <div class="label">
          <div class="label-text-alt text-error font-semibold"></div>
        </div>
      </label>

      <label for="" class="form-control w-full">
        <div class="label">
          <div class="label-text">Grade Level</div>
        </div>
        <select class="select select-bordered">
          <option value="" disabled selected>-- Select grade level</option>

          @for (item of gradeLevels; track $index) {
          <option [value]="item.id">{{ item.level }}</option>
          }
        </select>
        <div class="label">
          <div class="label-text-alt text-error font-semibold"></div>
        </div>
      </label>


      <label for="" class="form-control w-full">
        <div class="label">
          <div class="label-text">Description</div>
        </div>
        <textarea class="textarea textarea-bordered"></textarea>
        <div class="label">
          <div class="label-text-alt text-error font-semibold"></div>
        </div>
      </label>

    </div>
  </section>

  <section class="grid grid-cols-12">
    <div class="col-span-2">
      <!-- <div class="font-semibold text-lg">Topics</div> -->
    </div>

    <div class="col-span-9">
      <div class="flex items-center gap-5">
        <span class="font-semibold">Topics</span>
        <button class="btn btn-sm" type="button" (click)="addTopicForm()">Add topic</button>
      </div>
      <br>
      @for (item of topics.controls; track $index) {
      <div>
        <div class="border-b border-base-200">
          <span>Topic {{$index}}</span>
        </div>
        <div class="container mx-auto">
          <label for="" class="form-control w-full">
            <div class="label">
              <div class="label-text">Description</div>
            </div>
            <textarea class="textarea textarea-bordered"></textarea>
            <div class="label">
              <div class="label-text-alt text-error font-semibold"></div>
            </div>
          </label>
        </div>
      </div>
      }
    </div>
  </section>
</form>
