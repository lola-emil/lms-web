<div class="container mx-auto">
  <span class="text-lg font-semibold">Add/Edit Content</span>
  <br>
  <br>
  <form [formGroup]="topicFormGroup" (submit)="submit()">
    <label for="" class="form-control w-full max-w-sm">
      <div class="label">
        <div class="label-text">Topic</div>
      </div>
      <select class="select select-bordered" (change)="updateTopicForm($event)">
        <option value="">-- New topic</option>

        @for (item of topics; track $index) {
        <option [value]="item.id">{{ item.title }}</option>
        }
      </select>
      <div class="label">
        <div class="label-text-alt text-error font-semibold"></div>
      </div>
    </label>

    <br>
    <div class="flex items-center gap-3">
      <input type="text" formControlName="title" value="New topic"
        class="input hover:bg-base-200 text-lg font-semibold w-full">
    </div>
    <hr>
    <br>
    <button type="button" class="btn btn-sm" (click)="addLessonField()">Add new lesson</button>
    <br>
    <br>
    <table class="table border rounded-md">
      <thead>
        <tr>
          <th>Lesson Title</th>
          <th align="right"></th>
          <th align="right"></th>
        </tr>
      </thead>
        <tbody formArrayName="lessons">
          @for (item of lessonFields.controls; track $index) {
          <tr [formGroupName]="$index">
            <td><input formControlName="title" type="text" class="input input-bordered input-sm"></td>
            <td align="right">
              <input type="file" formControlName="file_upload" class="file-input file-input-sm file-input-bordered w-full max-w-xs" />
            </td>
            <td align="right"><button class="btn btn-xs btn-ghost" type="button" (click)="deleteLessonField($index)">
                <span>
                  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M21.5 6a1 1 0 0 1-.883.993L20.5 7h-.845l-1.231 12.52A2.75 2.75 0 0 1 15.687 22H8.313a2.75 2.75 0 0 1-2.737-2.48L4.345 7H3.5a1 1 0 0 1 0-2h5a3.5 3.5 0 1 1 7 0h5a1 1 0 0 1 1 1Zm-7.25 3.25a.75.75 0 0 0-.743.648L13.5 10v7l.007.102a.75.75 0 0 0 1.486 0L15 17v-7l-.007-.102a.75.75 0 0 0-.743-.648Zm-4.5 0a.75.75 0 0 0-.743.648L9 10v7l.007.102a.75.75 0 0 0 1.486 0L10.5 17v-7l-.007-.102a.75.75 0 0 0-.743-.648ZM12 3.5A1.5 1.5 0 0 0 10.5 5h3A1.5 1.5 0 0 0 12 3.5Z"
                      class="fill-base-content" />
                  </svg>
                </span>
              </button></td>
          </tr>
          }
        </tbody>
    </table>
    <br>
    <button class="btn w-full">Submit</button>
  </form>
</div>
