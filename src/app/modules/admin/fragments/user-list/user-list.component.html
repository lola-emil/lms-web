<div class="container mx-auto">

  <!-- FORM -->

  <!-- LIST SECTION -->
  <section class="grid grid-cols-12">
    <!-- <div class="col-span-2">
      <p class="font-semibold text-lg">User List</p>
    </div> -->
    <div class="col-span-10">

      <br>
      <div class="min-h-36">
        <div class="w-full flex mb-5 justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="join">
              <button class="join-item btn btn-sm" (click)="prevUserListPage()"
                [disabled]="userListPage == 1">«</button>
              <button class="join-item btn btn-sm"> {{userListPage}} </button>
              <button class="join-item btn btn-sm" (click)="nextUserListPage()"
                [disabled]="userListPage == userListMaxPage">»</button>
            </div>

            <label class="input input-bordered input-sm flex items-center gap-2">
              <input type="text" class="grow" placeholder="Search" />
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                class="h-4 w-4 opacity-70">
                <path fill-rule="evenodd"
                  d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z"
                  clip-rule="evenodd" />
              </svg>
            </label>
          </div>
        </div>
        <table class="table">
          <thead>
            <tr class="bg-base-200">
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Date added</th>
              <th>Last Active</th>
              <th></th>
            </tr>
          </thead>
          <tbody>

            @for (item of users; track $index) {
            <tr>
              <td> {{item.profile?.lname}}, {{ item.profile?.fname }}</td>
              <td>{{ item.user.email }}</td>
              <td>
                <div class="badge badge-outline "
                [ngClass]="item.role?.role_name =='student' ? 'badge-primary'
                : item.role?.role_name == 'teacher' ? 'badge-accent' : 'badge-secondary'">

                  {{ item.role?.role_name }}
                </div>
              </td>
              <td>{{ item.user.created_at | date: 'medium' }}</td>
              <td>{{ item.user.last_active | date: 'medium' }}</td>
              <td align="right">
                <button class="btn btn-sm btn-ghost" aria-label="edit">
                  <span>
                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M13.94 5 19 10.06 9.062 20a2.25 2.25 0 0 1-.999.58l-5.116 1.395a.75.75 0 0 1-.92-.921l1.395-5.116a2.25 2.25 0 0 1 .58-.999L13.938 5Zm7.09-2.03a3.578 3.578 0 0 1 0 5.06l-.97.97L15 3.94l.97-.97a3.578 3.578 0 0 1 5.06 0Z"
                        class="fill-base-content" />
                    </svg>
                  </span>
                </button>
                <button class="btn btn-sm btn-ghost" aria-label="delete">
                  <span>
                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M21.5 6a1 1 0 0 1-.883.993L20.5 7h-.845l-1.231 12.52A2.75 2.75 0 0 1 15.687 22H8.313a2.75 2.75 0 0 1-2.737-2.48L4.345 7H3.5a1 1 0 0 1 0-2h5a3.5 3.5 0 1 1 7 0h5a1 1 0 0 1 1 1Zm-7.25 3.25a.75.75 0 0 0-.743.648L13.5 10v7l.007.102a.75.75 0 0 0 1.486 0L15 17v-7l-.007-.102a.75.75 0 0 0-.743-.648Zm-4.5 0a.75.75 0 0 0-.743.648L9 10v7l.007.102a.75.75 0 0 0 1.486 0L10.5 17v-7l-.007-.102a.75.75 0 0 0-.743-.648ZM12 3.5A1.5 1.5 0 0 0 10.5 5h3A1.5 1.5 0 0 0 12 3.5Z"
                        class="fill-base-content" />
                    </svg>
                  </span>
                </button>
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </section>

</div>
