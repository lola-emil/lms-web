<app-layout>

  <div class="container mx-auto p-2">
    <div class="h-28"></div>
    <h1 class="text-4xl font-bold">Student Dashboard</h1>
    <br>
    <br>
    <br>
    <div class="grid grid-cols-12 gap-10">


      <div class="col-span-12 lg:col-span-9">
        <div class="border-b border-base-200 mb-5 flex items-center justify-between pb-2">
          <span class="font-semibold">Overview</span>
        </div>

        <div class=" grid grid-cols-3 gap-5">

          @for (item of subjectOverview; track $index) {
            <div class="card card-bordered" (click)="openSubjectDetail(item.id)">
              <div class="card-body p-3">
                <div class="min-h-14 bg-base-200"></div>
                <p class="font-semibold">{{ item.subject_name }}</p>
                <p class="text-sm">Assignments 0, Exams 0</p>
              </div>
            </div>
          }

        </div>


        <div class="border-b border-base-200 mb-5 flex items-center mt-12 justify-between pb-2">
          <span class="font-semibold">Recent assignments</span>
        </div>

        <app-table [headers]="assignmentHeaders" [tableData]="assignments"></app-table>

        <!-- <table class="table">
          <thead>
            <tr class="bg-base-200">
              <th>Title</th>
              <th>Subject</th>
              <th>Due date</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td><div class="link" (click)="peekAssignment()">Introduction to accounting act. 1</div></td>
              <td>Mathematics</td>
              <td>2025-04-09</td>
              <td><div class="badge">Pending</div></td>
            </tr>
          </tbody>
        </table> -->


      </div>

      <div class="col-span-3 hidden lg:block">
        <div class="border-b border-base-200 pb-2">
          <span class="font-semibold">Upcoming events/deadlines</span>
        </div>
      </div>
    </div>




  </div>

</app-layout>
