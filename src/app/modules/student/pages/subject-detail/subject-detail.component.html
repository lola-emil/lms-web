<nav class="navbar bg-base-100 border-b border-base-content/5 px-5">
  <div class="navbar-start">
    <a routerLink="/student/enrolled-subjects" class="btn btn-sm">Go Back</a>
  </div>
  <div class="navbar-end"></div>
</nav>

<div class="container mx-auto">
  <br>
  <h3 class="text-4xl font-semibold">{{subjectName}}</h3>
  <br>

  <table>
    <tr>
      <td class="py-2 pr-5 text-md flex items-center gap-3">
        <span>
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 2v6a2 2 0 0 0 2 2h6v10a2 2 0 0 1-2 2h-6.81A6.5 6.5 0 0 0 4 11.498V4a2 2 0 0 1 2-2h6Zm1.5.5V8a.5.5 0 0 0 .5.5h5.5l-6-6Zm-1.5 15a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0Zm-2.146-2.354a.5.5 0 0 0-.708 0L5.5 18.793l-1.646-1.647a.5.5 0 0 0-.708.708l2 2a.5.5 0 0 0 .708 0l4-4a.5.5 0 0 0 0-.708Z"
              class="fill-base-content" />
          </svg>
        </span>
        Subject Code
      </td>
      <td class="text-md" align="">
        {{subjectCode ?? "Not Set"}}
      </td>
    </tr>
    <tr>
      <td class="py-2 pr-5 text-md flex items-center gap-3">
        <span>
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 2v6a2 2 0 0 0 2 2h6v10a2 2 0 0 1-2 2h-6.81A6.5 6.5 0 0 0 4 11.498V4a2 2 0 0 1 2-2h6Zm1.5.5V8a.5.5 0 0 0 .5.5h5.5l-6-6Zm-1.5 15a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0Zm-2.146-2.354a.5.5 0 0 0-.708 0L5.5 18.793l-1.646-1.647a.5.5 0 0 0-.708.708l2 2a.5.5 0 0 0 .708 0l4-4a.5.5 0 0 0 0-.708Z"
              class="fill-base-content" />
          </svg>
        </span>
        Grade Level
      </td>
      <td class="text-md" align="">
        {{gradeLevel}}
      </td>
    </tr>

    <tr>
      <td class="py-1 pr-12 text-md flex items-center gap-3">
        <span>
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M21 8.5v9.25A3.25 3.25 0 0 1 17.75 21H6.25A3.25 3.25 0 0 1 3 17.75V8.5h18ZM7.25 15a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5ZM12 15a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm-4.75-4.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm4.75 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm4.75 0a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5Zm1-7.5A3.25 3.25 0 0 1 21 6.25V7H3v-.75A3.25 3.25 0 0 1 6.25 3h11.5Z"
              class="fill-base-content" />
          </svg>
        </span>
        Schedule
      </td>
      <td class="text-md" align="">Moday 08:00AM - 09:00AM</td>
    </tr>
  </table>

  <br>
  <br>
  <div role="tablist" class="tabs tabs-border">
    <a routerLinkActive="tab-active" routerLink="lessons" role="tab" class="tab">Lessons</a>
    <a routerLinkActive="tab-active" routerLink="assignments-and-activities" role="tab" class="tab">Activities & Assignments</a>
  </div>

  <router-outlet></router-outlet>
</div>
