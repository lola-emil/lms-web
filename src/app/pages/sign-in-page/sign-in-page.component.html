<main class="h-screen flex">
  <div class="flex-1 flex items-center justify- flex-col ">
    <div class="w-full h-16 px-8 flex items-center justify-between">
      <div class="">
        <a routerLink="/" class="btn btn-ghost hover:bg-neutral-800">Sta. Cruz Learning Center</a>
      </div>
    </div>
    <div class="container flex-1 flex flex-col items-center justify-center">
      <div class="flex flex-col">
        <p class="text-xl font-semibold">Sign In</p>
      </div>

      <form action="/student/dashboard" class="card flex flex-col items-center">
        <div class="card-body">
          <label class="form-control w-72">
            <div class="label">
              <span class="label-text">Email / LRN</span>
            </div>
            <input type="text" class="input input-bordered border border-neutral-700 w-full" />
            <div class="label">
              <span class="label-text-alt text-error"></span>
            </div>
          </label>

          <label class="form-control w-full">
            <div class="label">
              <span class="label-text">Password</span>
            </div>
            <input type="password" name="password" class="input input-bordered border-neutral-700 w-full " />
            <div class="label">
              <span class="label-text-alt"></span>
            </div>
          </label>
          <button class="btn bg-white text-neutral-800 w-full">Log In</button>
          <a routerLink="/forgot-credential" class="link link-secondary text-sm">Forgot email or password</a>
        </div>
      </form>

      <div></div>
    </div>
  </div>
  <div class="flex-1 bg-neutral-800">
  </div>
</main>
