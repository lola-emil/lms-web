<nav class="navbar">
  <div class="navbar-start">
    <a routerLink="" class="btn btn-ghost">Sta. Cruz Learning Center Inc.</a>
  </div>
</nav>

<section class="h-[calc(100vh-4rem)] flex">
  <form [formGroup]="signInForm" (submit)="submit()" class="flex-1 flex flex-col items-center justify-center">
    <div class="w-80">
      <p class="text-xl font-semibold">Login</p>
      <br>

      <label class="form-control w-full">
        <div class="label">
          <span class="label-text">Email/LRN</span>
        </div>
        <input type="text" formControlName="email" class="input input-bordered w-full" />
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>
      <br>
      <br>
      <label class="form-control w-full">
        <div class="label">
          <span class="label-text">Password</span>
        </div>
        <input type="password" formControlName="password" class="input input-bordered w-full" />
        <div class="label">
          <span class="label-text-alt"></span>
        </div>
      </label>
      <br>
      <br>

      <button class="btn btn-neutral w-full">Log In</button>
    </div>
  </form>
  <div class="flex-1">
    <img src="" alt="">
  </div>
</section>
