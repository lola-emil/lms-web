<div>
  <div class="flex justify-between items-center">
    <p class="font-semibold text-sm">{{monthNames[currentMonth]}} {{ currentYear }}</p>

    <div class="join">
      <button class="join-item hover:bg-neutral-700 btn btn-sm btn-ghost" (click)="prevMonth()">«</button>
      <button class="join-item hover:bg-neutral-700 btn btn-sm btn-ghost" (click)="resetCalendar()">Today</button>
      <button class="join-item hover:bg-neutral-700 btn btn-sm btn-ghost" (click)="nextMonth()">»</button>
    </div>
  </div>

  <table class="w-full mt-5 table border border-base-200">
    <thead>
      <tr class="border-b border-base-200">
        @for (weekDays of weekDays; track $index) {
        <td class="border" align="center">{{weekDays}}</td>
        }
      </tr>
    </thead>
    <tbody>
      @for (week  of calendar; track $index) {
        <tr>
          @for (day of week; track $index) {
            <td class="border"
            [class.today]="isToday(day?.date)"
            [class.other-month]="day?.isOtherMonth"
            >
            <div class="text-center">
              {{ day?.date }}
            </div>
          </td>
          }
        </tr>
      }
    </tbody>
  </table>


  <br>

  <div class="flex flex-col w-full">

    <div class="card border border-l-8">
      <div class="card-body p-3">
        <p class="text-sm">Math live session</p>
        <p class="text-xs">{{ "2025-04-20" | date: "medium" }}</p>
      </div>
    </div>


  </div>
</div>
